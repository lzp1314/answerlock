name: 从 Gitee 同步

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 Gitee 拉取并快进
        run: |
          git config user.name "answerlock-sync"
          git config user.email "answerlock-sync@users.noreply.github.com"
          git remote add gitee https://gitee.com/lzp-zl/answerlock.git
          git fetch gitee master:refs/remotes/gitee/master

          if git merge-base --is-ancestor gitee/master HEAD; then
            echo "Gitee 上没有新内容，本次跳过。"
            exit 0
          fi

          # 只做快进合并：不会覆盖本仓库独有的文件，也不会删掉本 workflow
          git merge --ff-only gitee/master
          git push origin master
          echo "已同步到 $(git rev-parse --short HEAD)"
